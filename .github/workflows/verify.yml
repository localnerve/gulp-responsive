name: Verify
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, public-package ]

jobs:
  verify:

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - name: Run Lint and Test
      # If Node version does not start with 26, run lint and coverage
      if: ${{ !startsWith(matrix.node-version, '26') }}
      run: npm run lint && npm run coverage
    - name: Run Lint and Test (Node 26 Skip Coverage)
      # If Node version starts with 26, run lint and test only. Wait for c8 yargs@18
      if: ${{ startsWith(matrix.node-version, '26') }}
      run: npm run lint && npm test
    - name: Coverage Upload
      # Only run if previous steps succeeded AND it is NOT Node 26
      if: ${{ success() && !startsWith(matrix.node-version, '26') }}
      uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # 2.3.7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./coverage/lcov.info
        fail-on-error: false
